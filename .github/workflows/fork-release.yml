name: Fork release

on:
  push:
    tags:
      - 'fork-v*'

permissions: {}

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hxy91819/bb-plugin-usage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global bb-app@0.44.0
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:built
      - name: Package the tagged aggregate
        run: node scripts/package-release.mjs "$GITHUB_REF_NAME" release-assets
      - name: Install the archive in a clean BB instance
        env:
          BB_RELEASE_RUNTIME: /usr/local/lib/node_modules/bb-app
        run: |
          export BB_RELEASE_RUNTIME="$(npm root --global)/bb-app"
          node scripts/smoke-release.mjs release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish and read back the exact verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-assets
